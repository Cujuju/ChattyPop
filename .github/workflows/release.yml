# Publishes the Windows installer and latest.yml as v<version>. Manual runs release main; pushed tags must match the target commit’s version.
name: Release app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: app-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Version calculation requires complete git history.
          fetch-depth: 0

      - name: Set up pnpm (packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Electron's download
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Check the version is unreleased, and a pushed tag names it
        id: version
        run: |
          $version = node scripts/runTs.mjs scripts/printVersion.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            Write-Error "Tag $env:GITHUB_REF_NAME is not this commit's version, $version. Delete it and tag the commit $tag."
            exit 1
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "$tag is already released. Commit something, then release again."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          exit 0

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm dist

      - name: Publish the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # --target tags the commit just built (a dispatch's tag doesn't exist yet); a pushed tag already names it.
        run: |
          $installer = "release/ChattyPop-Setup-$env:VERSION.exe"
          gh release create "v$env:VERSION" $installer "$installer.blockmap" release/latest.yml `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ChattyPop $env:VERSION" --generate-notes
          exit $LASTEXITCODE
