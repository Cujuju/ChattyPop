<!doctype html>
<!-- Shown while the app starts. Static, no script: main drives it (src/main/splashWindow.mjs). A dev launcher loads it from disk before anything builds. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'" />
    <title>ChattyPop</title>
    <link rel="stylesheet" href="./src/theme/splash.css" />
  </head>
  <body class="splash">
    <img class="splash-icon" src="../../build/icon.svg" alt="" />
    <h1 class="splash-name">ChattyPop</h1>
    <p class="splash-status" id="splash-status">Starting…</p>
    <div class="splash-progress" id="splash-progress" role="progressbar" aria-label="Startup progress" aria-valuemin="0">
      <div class="splash-progress-fill"></div>
    </div>
  </body>
</html>
