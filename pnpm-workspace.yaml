# Hoisted node_modules: electron-builder resolves runtime deps from a flat tree.
nodeLinker: hoisted

allowBuilds:
  # Ships Node-API prebuilds in its tarball; the implicit node-gyp build is not needed.
  better-sqlite3-multiple-ciphers: false
  electron: true
  # Squirrel installer helper; ChattyPop packages with NSIS/dir.
  electron-winstaller: false
  esbuild: true
  # The owner's drag-to-reorder package, from GitHub at v0.3.0-rc.4 (not on npm): its prepare step builds dist.
  '@cujuju/solid-reorder-list@https://codeload.github.com/Cujuju/solid-reorder-list/tar.gz/d7b9502b6b79df8f045446836c761b9f53274919': true

# Exempts local packages from pnpm’s minimum release age.
minimumReleaseAgeExclude:
  - '@cujuju/solidjs-color-picker@0.3.0'
  - '@cujuju/solidjs-pill-number-picker@0.5.1'
  - '@cujuju/solidjs-seg-buttons@0.3.0'
  - '@cujuju/solidjs-virtual-log@0.2.0'
  - '@cujuju/solidjs-hooks@2.1.0'

# Security floors for transitive deps, each bounded to the fixed major.
overrides:
  'source-map-js@>=1.0.0 <1.2.2': '^1.2.2'
  'http-cache-semantics@<4.3.0': '^4.3.0'
  # Crosses majors: xcode (via @capacitor/cli) only calls uuid.v4(), which uuid 11's CJS build exports.
  'uuid@<11.1.1': '^11.1.1'
